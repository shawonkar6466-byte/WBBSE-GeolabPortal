    <script>
      (function() {
        // 1. Suppress console.error for harmless Vite HMR WebSocket notices
        var _origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (typeof arg === 'string' && (arg.indexOf('WebSocket') !== -1 || arg.indexOf('[vite]') !== -1)) {
              return;
            }
            if (arg && arg.message && typeof arg.message === 'string' && (arg.message.indexOf('WebSocket') !== -1 || arg.message.indexOf('[vite]') !== -1)) {
              return;
            }
          }
          return _origError.apply(console, arguments);
        };

        // 2. Mock Vite HMR WebSockets to prevent 'WebSocket closed without opened' errors in sandbox
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWS = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            var isVite = (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) ||
                         (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.indexOf('vite') !== -1; })) ||
                         (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1));

            if (isVite) {
              var listeners = {};
              var wsMock = {
                url: url,
                readyState: 1, // OPEN
                bufferedAmount: 0,
                extensions: '',
                protocol: typeof protocols === 'string' ? protocols : '',
                binaryType: 'blob',
                send: function() {},
                close: function() {
                  wsMock.readyState = 3;
                },
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      if (typeof wsMock.onopen === 'function') wsMock.onopen(new Event('open'));
                      fn(new Event('open'));
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(l) { return l !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              setTimeout(function() {
                if (typeof wsMock.onopen === 'function') wsMock.onopen(new Event('open'));
              }, 0);
              return wsMock;
            }
            return new OriginalWS(url, protocols);
          }
          ViteSafeWebSocket.prototype = OriginalWS.prototype;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          window.WebSocket = ViteSafeWebSocket;
        }

        // 3. Catch window errors & unhandled promise rejections
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('[vite]') !== -1 || event.message.indexOf('ws://') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = String(event.reason && (event.reason.message || event.reason));
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('[vite]') !== -1 || reason.indexOf('ws://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

  </body>
